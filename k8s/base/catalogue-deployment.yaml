apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-deployment
  namespace: default
  labels:
    app: catalogue
spec:
  selector:
    matchLabels:
      app: catalogue
  replicas: 1
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      containers:
      - name: catalogue
        image:  ziemo0/catalogue:v1
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 100m
            memory: 200Mi
        ports:
        - containerPort:  5000
          name: catalogue
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: catalogue-configmap
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: catalogue-configmap
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: catalogue-configmap
              key: DB_PASSWORD

