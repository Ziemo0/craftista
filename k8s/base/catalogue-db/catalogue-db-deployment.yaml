apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-db-deployment
  namespace: default
  labels:
    app: catalogue-db
spec:
  selector:
    matchLabels:
      app: catalogue-db
  replicas: 1
  template:
    metadata:
      labels:
        app: catalogue-db
    spec:
      containers:
        - name: catalogue-db
          image:  postgres:16.2-alpine3.19
          ports:
          - containerPort:  5432
            name: catalogue-db
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 100m
              memory: 500Mi
          env:
          - name: POSTGRES_DB
            value: "catalogue"
          - name: POSTGRES_USER
            value: "postgres"
          - name: POSTGRES_PASSWORD
            value: "password"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: catalogue-db-storage
      volumes:
        - name: catalogue-db-storage
          persistentVolumeClaim:
            claimName: catalogue-db-pvc